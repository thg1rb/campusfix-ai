name: ku-spot
services:
  web:
    build: ./apps/web
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok) process.exitCode=1}).catch(()=>{process.exitCode=1})"]
      interval: 5s
      timeout: 4s
      retries: 20
  api:
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      API_PORT: "8080"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-kuspot}:${POSTGRES_PASSWORD:-kuspot-local}@db:5432/${POSTGRES_DB:-kuspot}?sslmode=disable}"
      AI_BASE_URL: http://ai:8000
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ku-spot-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-kuspot-minio}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-kuspot-minio-local}}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 15
  ai:
    build: ./apps/ai
    env_file:
      - path: ./apps/ai/.env
        required: false
    environment:
      AI_PORT: "8000"
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 15
  minio:
    build: ./infra/minio
    image: ku-spot-minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: build
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kuspot-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kuspot-minio-local}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15
  db:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kuspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuspot-local}
      POSTGRES_DB: ${POSTGRES_DB:-kuspot}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  minio-data:
  postgres-data:
