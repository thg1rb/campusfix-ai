[project]
name = "campusfix-ai"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.165.0",
    "google-genai>=3.6.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campusfix_ai"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
