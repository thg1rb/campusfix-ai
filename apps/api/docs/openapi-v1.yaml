      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
