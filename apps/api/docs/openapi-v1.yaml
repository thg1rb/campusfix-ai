            VALIDATION_ERROR:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: use 3–30 letters, digits or underscores
                  details: {}
                  requestId: ku-request-2026
    InvalidAccess:
      description: The resulting account roles or department assignment are invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
