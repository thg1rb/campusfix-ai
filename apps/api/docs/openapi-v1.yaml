    ProxyUnavailable:
      description: The Web proxy could not complete the upstream request. Direct callback failures redirect with
        an error code.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            SERVICE_UNAVAILABLE:
              value:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is temporarily unavailable.
                  details: {}
                  requestId: ku-request-2026
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
      example:
        status: ok
    ReadyResponse:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
        checks:
          $ref: '#/components/schemas/ReadyChecks'
      example:
        status: ok
        checks:
          db: ok
          ai: ok
    ReadyChecks:
      type: object
      required:
      - db
      - ai
      properties:
        db:
          type: string
          enum:
          - ok
          - unavailable
        ai:
          type: string
          enum:
          - ok
          - unavailable
    ProbeError:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - error
      example:
        status: error
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required:
      - code
      - message
      - details
      - requestId
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: The request is invalid.
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
