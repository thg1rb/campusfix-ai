  /api/v1/admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags:
      - Admin Audit Logs
      summary: List audit log entries
      description: Requires an active exclusive ADMINISTRATOR. Returns append-only audit entries sorted by newest
        creation time, then descending ID.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: entityType
        in: query
        description: Exact entity type. Omission or an empty value leaves the filter off.
        schema:
          $ref: '#/components/schemas/AuditEntityType'
      - name: action
        in: query
        description: Exact, case-sensitive action name. Omission or an empty value leaves the filter off.
        schema:
          type: string
          example: UPDATE_USERNAME
      - name: actorUserId
        in: query
        description: Filter by the recorded user actor ID. Omission or an empty value leaves the filter off.
        schema:
          type: string
          format: uuid
          example: 7e86a5db-d6c6-4157-af22-2efc48d2361b
      responses:
        '200':
          description: A page of audit log entries.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogs'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ku_spot_session
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      description: Optional correlation ID. The server replaces invalid or missing values.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
        example: ku-request-2026
    Page:
      name: page
      in: query
      description: One-based page. An omitted or empty value uses the default.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 21474836
        example: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size. An omitted or empty value uses the default.
      schema:
        type: integer
        format: int32
        enum:
        - 25
        - 50
        - 100
        example: 25
        default: 25
    MasterId:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    MasterSearch:
      name: "q"
      in: "query"
      description: "Trimmed case-insensitive literal substring search."
      schema:
        type: "string"
    MasterActive:
      name: "isActive"
      in: "query"
      description: "Filter by active status. Omit to include both statuses."
      schema:
        type: "boolean"
    MasterLocationType:
      name: "type"
      in: "query"
      description: "Exact campus location type."
      schema:
        "$ref": "#/components/schemas/CampusLocationType"
    Origin:
      name: Origin
      in: header
      description: Must match APP_BASE_URL by scheme, hostname and effective port when supplied. A cookie-authenticated
        write requires this or a matching Referer.
      schema:
        type: string
        format: uri
        example: http://localhost:3000
    Referer:
      name: Referer
      in: header
      description: Fallback origin proof when Origin is absent. Must have the APP_BASE_URL origin.
      schema:
        type: string
        format: uri
        example: http://localhost:3000/settings/profile
    SecFetchSite:
      name: Sec-Fetch-Site
      in: header
      description: When supplied, must be same-origin.
      schema:
        type: string
        enum:
        - same-origin
  headers:
    X-Request-Id:
      description: Correlation ID. API error envelopes repeat this value in error.requestId.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
        example: ku-request-2026
    Cache-Control:
      description: Disables response caching.
      schema:
        type: string
        enum:
        - no-store
    Location:
      description: Redirect destination.
      schema:
        type: string
        format: uri
        example: https://accounts.google.com/o/oauth2/v2/auth?response_type=code&state=example-state
    Set-Cookie:
      description: One header field per cookie change. OAuth callback success sends two Set-Cookie fields.
      schema:
        type: string
    Referrer-Policy:
      description: Prevents forwarding the original URL as a referrer.
      schema:
        type: string
        enum:
        - no-referrer
  responses:
    MasterNameTaken:
      description: "The name is already reserved. Uniqueness is case-insensitive."
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/X-Request-Id"
        Cache-Control:
          "$ref": "#/components/headers/Cache-Control"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          examples:
            NAME_TAKEN:
              value:
                error:
                  code: "NAME_TAKEN"
                  message: "name is already taken"
                  details: {}
                  requestId: "ku-request-2026"
    MasterNotFound:
      description: "The master data record does not exist."
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/X-Request-Id"
        Cache-Control:
          "$ref": "#/components/headers/Cache-Control"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          examples:
            NOT_FOUND:
              value:
                error:
                  code: "NOT_FOUND"
                  message: "The requested resource was not found."
                  details: {}
                  requestId: "ku-request-2026"
    InvalidMasterData:
      description: "One or more master data fields failed validation."
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/X-Request-Id"
        Cache-Control:
          "$ref": "#/components/headers/Cache-Control"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          examples:
            VALIDATION_ERROR:
              value:
                error:
                  code: "VALIDATION_ERROR"
                  message: "The request did not pass validation."
                  details: {}
                  requestId: "ku-request-2026"
    InvalidMasterLocation:
      description: "One or more location fields failed validation."
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/X-Request-Id"
        Cache-Control:
          "$ref": "#/components/headers/Cache-Control"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          examples:
            VALIDATION_ERROR:
              value:
                error:
                  code: "VALIDATION_ERROR"
                  message: "The request did not pass validation."
                  details: {}
                  requestId: "ku-request-2026"
            COORDINATES_OUT_OF_BOUNDS:
              value:
                error:
                  code: "COORDINATES_OUT_OF_BOUNDS"
                  message: "coordinates must be within KU Bangkhen"
                  details: {}
                  requestId: "ku-request-2026"
    InvalidRequest:
      description: Malformed request data or invalid path or query parameter.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            INVALID_REQUEST:
              value:
                error:
                  code: INVALID_REQUEST
                  message: The request is invalid.
                  details: {}
                  requestId: ku-request-2026
    Unauthenticated:
      description: The session cookie is missing, invalid, expired, revoked, or belongs to an inactive account.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UNAUTHENTICATED:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Sign in to continue.
                  details: {}
                  requestId: ku-request-2026
    Forbidden:
      description: The caller lacks the required exclusive administrator role.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            FORBIDDEN:
              value:
                error:
                  code: FORBIDDEN
                  message: You do not have access.
                  details: {}
                  requestId: ku-request-2026
    InvalidOrigin:
      description: The request failed write-origin or Fetch Metadata verification.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            FORBIDDEN:
              value:
                error:
                  code: FORBIDDEN
                  message: You do not have access.
                  details: {}
                  requestId: ku-request-2026
    AdminWriteForbidden:
      description: The caller lacks the required exclusive administrator role or the request failed write-origin
        verification.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            FORBIDDEN:
              value:
                error:
                  code: FORBIDDEN
                  message: You do not have access.
                  details: {}
                  requestId: ku-request-2026
    NotFound:
      description: The requested user could not be found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            NOT_FOUND:
              value:
                error:
                  code: NOT_FOUND
                  message: The requested resource was not found.
                  details: {}
                  requestId: ku-request-2026
    UsernameTaken:
      description: A user already has the requested username. Uniqueness is case-insensitive.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            USERNAME_TAKEN:
              value:
                error:
                  code: USERNAME_TAKEN
                  message: username is already taken
                  details: {}
                  requestId: ku-request-2026
    LastActiveAdmin:
      description: The change would remove the last active exclusive administrator.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            LAST_ACTIVE_ADMIN:
              value:
                error:
                  code: LAST_ACTIVE_ADMIN
                  message: at least one active administrator must remain
                  details: {}
                  requestId: ku-request-2026
    BodyTooLarge:
      description: The HTTP request body exceeds Fiber’s 4 MiB limit. The listener rejects it before endpoint execution.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            INTERNAL_ERROR:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: The request could not be completed.
                  details: {}
                  requestId: ku-request-2026
    ProbeBodyTooLarge:
      description: The request body exceeds Fiber’s 4 MiB limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProbeError'
    UnsupportedMediaType:
      description: The request needs Content-Type application/json. Media type parameters are allowed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            UNSUPPORTED_MEDIA_TYPE:
              value:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: Use Content-Type application/json.
                  details: {}
                  requestId: ku-request-2026
    InvalidUsername:
