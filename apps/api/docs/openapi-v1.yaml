openapi: 3.0.3
info:
  title: KU Spot API
  version: 1.0.0
  description: |
    KU Spot is Kasetsart University's platform for reporting and resolving campus facility issues. This reference covers the Phase 0–2 Go API.

    ### Authentication and writes
    Google OAuth 2.0 accepts verified @ku.th identities. A successful callback issues an HttpOnly, SameSite=Lax session cookie. HTTPS requires Secure cookies. The API checks the current active account and session on each protected request. Administrator routes require ADMINISTRATOR as the sole role and no department.

    With a session cookie, writes require a matching Origin or, when Origin is absent, a matching Referer for APP_BASE_URL. Sec-Fetch-Site must be same-origin when present. Browsers manage these headers and the HttpOnly cookie. The direct Swagger UI on port 8080 can call the direct API on that origin. For authenticated browser writes, the page must also be on APP_BASE_URL. Use the same-origin Web proxy with the application, or use an HTTP client with a valid session cookie and matching Origin. The Web proxy handles /api/v1/*; use the direct API for the two probe paths.

    ### Responses and pagination
    API errors use the error envelope with camelCase fields, an empty details object for current errors, and a requestId matching X-Request-Id. OAuth callback outcomes use redirects. Probes use dedicated JSON. API and readiness responses use Cache-Control no-store. Lists default to page 1 and 25 items, with page sizes 25, 50 and 100. Empty pages return an empty items array.

    ### Deadlines and HTTP listener responses
    The Go API installs a cooperative 15-second request deadline. A propagated context deadline becomes 503 SERVICE_UNAVAILABLE. The Web proxy has a 30-second upstream budget and also returns 503 on upstream failure. The listener has 30-second read, write, and idle timeouts. Read timeouts can return 408; a write timeout can close the connection. The current API has no application-level rate limiter.

    The listener rejects bodies over 4 MiB with 413. Before routing, malformed HTTP can produce 400, oversized headers 431, unsupported methods or transfer codings 501, and network read errors 502 when a response can be sent. These failures can use the generic status-error payload when the API path cannot be recovered. Where the API path is known, the status is preserved and the error envelope uses INVALID_REQUEST for 400 or INTERNAL_ERROR for the other listener errors above. Unmatched API paths and unsupported methods on a known API route return 404 NOT_FOUND and 405 METHOD_NOT_ALLOWED respectively.
servers:
- url: http://localhost:8080
  description: Direct Go API and operational probes
- url: http://localhost:3000
  description: Web proxy for /api/v1/*
tags:
- name: Health
- name: Auth
- name: Profile
- name: Admin Users
- name: Public Master Data
- name: Admin Categories
- name: Admin Departments
- name: Admin Locations
- name: Admin Audit Logs
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
      - Health
      summary: Check API liveness
      description: Returns the API process liveness independently of PostgreSQL and the AI Gateway. Direct API only.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The API is running.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '413':
          $ref: '#/components/responses/ProbeBodyTooLarge'
      servers:
      - url: http://localhost:8080
        description: Direct Go API and operational probes
  /readyz:
    get:
      operationId: getReadiness
      tags:
      - Health
      summary: Check API readiness
      description: Checks PostgreSQL with SELECT 1 and the AI Gateway via /healthz concurrently within two seconds.
        The Web readiness endpoint is /api/health.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Both dependencies are reachable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  value:
                    status: ok
                    checks:
                      db: ok
                      ai: ok
        '503':
          description: At least one dependency is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                aiUnavailable:
                  value:
                    status: unavailable
                    checks:
                      db: ok
                      ai: unavailable
                dbUnavailable:
                  value:
                    status: unavailable
                    checks:
                      db: unavailable
                      ai: ok
                bothUnavailable:
                  value:
                    status: unavailable
                    checks:
                      db: unavailable
                      ai: unavailable
        '413':
          $ref: '#/components/responses/ProbeBodyTooLarge'
      servers:
      - url: http://localhost:8080
        description: Direct Go API and operational probes
  /api/v1/auth/login:
    get:
      operationId: startGoogleLogin
      tags:
      - Auth
      summary: Start Google OAuth login
      description: Starts the browser OAuth flow for verified @ku.th accounts using state, nonce and S256 PKCE.
        Navigate to this endpoint in the browser.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: next
        in: query
        description: Optional same-origin path starting with a single slash. Invalid paths are ignored. The handler
          rejects paths over 1024 bytes, auth/API paths, unsafe characters or unsafe encoding.
        schema:
          type: string
          example: /settings/profile
      responses:
        '302':
          description: >
            Redirect to Google and issue ku_spot_oauth for /api/v1/auth for ten minutes.
            The signed cookie is HttpOnly and SameSite=Lax. Secure follows API configuration.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/callback:
    get:
      operationId: completeGoogleLogin
      tags:
      - Auth
      summary: Complete Google OAuth login
      description: Validates the signed state cookie and returned state before exchanging the code. Success provisions
        or loads the account and redirects to the saved path, or to /admin for exclusive administrators and /feed
        for other users. Failures redirect to /login with INVALID_OAUTH_STATE (missing, expired or mismatched state),
        OAUTH_DENIED (denial, missing code or rejected grant), INVALID_OAUTH_IDENTITY (failed identity checks),
        ACCOUNT_INACTIVE, or SERVICE_UNAVAILABLE (provider or service failure).
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: code
        in: query
        description: Google authorization code on successful provider authorization.
        schema:
          type: string
          example: example-code
      - name: state
        in: query
        description: State returned by Google. Required for successful validation.
        schema:
          type: string
          example: example-state
      - name: error
        in: query
        description: Provider error on unsuccessful authorization.
        schema:
          type: string
          example: access_denied
      - name: ku_spot_oauth
        in: cookie
        description: Signed state issued by login. Required for successful validation.
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the application or to its login page with a stable error code.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Location:
              description: Redirect destination.
              schema:
                type: string
                format: uri
              examples:
                SUCCESS:
                  value: http://localhost:3000/feed
                ADMIN_SUCCESS:
                  value: http://localhost:3000/admin
                INVALID_OAUTH_STATE:
                  value: http://localhost:3000/login?error=INVALID_OAUTH_STATE
                OAUTH_DENIED:
                  value: http://localhost:3000/login?error=OAUTH_DENIED
                INVALID_OAUTH_IDENTITY:
                  value: http://localhost:3000/login?error=INVALID_OAUTH_IDENTITY
                ACCOUNT_INACTIVE:
                  value: http://localhost:3000/login?error=ACCOUNT_INACTIVE
                SERVICE_UNAVAILABLE:
                  value: http://localhost:3000/login?error=SERVICE_UNAVAILABLE
            Set-Cookie:
              description: Always expires ku_spot_oauth. Success also sets the seven-day ku_spot_session cookie
                for /api/v1. Both cookies are HttpOnly and SameSite=Lax; Secure follows API configuration.
              schema:
                type: string
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ProxyUnavailable'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Sign out the current session
      description: Revokes the authenticated session and records a logout audit event. Write-origin verification
        runs before authentication.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/Referer'
      - $ref: '#/components/parameters/SecFetchSite'
      responses:
        '204':
          description: The session was revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              description: Expires ku_spot_session for /api/v1.
              schema:
                type: string
                example: ku_spot_session=; Path=/api/v1; Max-Age=0; HttpOnly; SameSite=Lax
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
      security:
      - cookieAuth: []
  /api/v1/me:
    get:
      operationId: getMyProfile
      tags:
      - Profile
      summary: Get the current user profile
      description: Returns private profile and current access information for the authenticated user, including
        real name and email.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The authenticated user profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security:
      - cookieAuth: []
  /api/v1/me/username:
    patch:
      operationId: updateMyUsername
      tags:
      - Profile
      summary: Update the current username
      description: Trims and validates the username, enforces case-insensitive uniqueness, and audits a change.
        Write-origin verification runs before authentication.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/Referer'
      - $ref: '#/components/parameters/SecFetchSite'
      responses:
        '200':
          description: The updated private profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/InvalidOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UsernameTaken'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidUsername'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUsernameRequest'
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      tags:
      - Admin Users
      summary: List users
      description: Requires an active exclusive ADMINISTRATOR. Returns private user profiles sorted by case-insensitive
        username, then ID.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: q
        in: query
        description: Case-insensitive literal substring search over username, real name and email. Whitespace is
          trimmed.
        schema:
          type: string
          example: narin
      - name: role
        in: query
        description: Filter by a single role. Omission or an empty value leaves the filter off.
        schema:
          $ref: '#/components/schemas/Role'
      - name: isActive
        in: query
        description: Filter on the literal true or false. Omission or an empty value leaves the filter off.
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: A page of user profiles.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserProfiles'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - cookieAuth: []
  /api/v1/admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags:
      - Admin Users
      summary: Update user access
      description: Requires an active exclusive ADMINISTRATOR. Applies a partial update and audits the before and
        after access. ADMINISTRATOR must be the only role and have no department. DEPARTMENT_STAFF requires one
        department. A newly specified department, or an existing assignment on reactivation, must be active. Deactivation
        revokes the target user’s sessions.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        description: ID of the target user.
        schema:
          type: string
          format: uuid
          example: 7e86a5db-d6c6-4157-af22-2efc48d2361b
        required: true
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/Referer'
      - $ref: '#/components/parameters/SecFetchSite'
      responses:
        '200':
          description: The updated private user profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/AdminWriteForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LastActiveAdmin'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidAccess'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
  /api/v1/public/master-data:
    get:
      operationId: "getPublicMasterData"
      tags:
        - "Public Master Data"
      summary: "Get public master data"
      description: "Returns only active entries ordered by lowercase name and ID. Department rows omit staff usernames."
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
      security: []
      responses:
        "200":
          description: "Get public master data."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicMasterDataResponse"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/ServiceUnavailable"
  /api/v1/admin/categories:
    get:
      operationId: "listAdminCategories"
      tags:
        - "Admin Categories"
      summary: "List categories"
      description: "Requires an active exclusive administrator. Lists active and disabled rows sorted by lowercase name and ID. Search matches name or description."
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
        - {"$ref": "#/components/parameters/Page"}
        - {"$ref": "#/components/parameters/PageSize"}
        - {"$ref": "#/components/parameters/MasterSearch"}
        - {"$ref": "#/components/parameters/MasterActive"}
      security:
        - {"cookieAuth": []}
      responses:
        "200":
          description: "List categories."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaginatedCategories"
        "400":
          "$ref": "#/components/responses/InvalidRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/ServiceUnavailable"
    post:
      operationId: "createAdminCategory"
      tags:
        - "Admin Categories"
      summary: "Create a category"
      description: "Requires an active exclusive administrator and same-origin write proof. New records are active."
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
        - {"$ref": "#/components/parameters/Origin"}
        - {"$ref": "#/components/parameters/Referer"}
        - {"$ref": "#/components/parameters/SecFetchSite"}
      security:
        - {"cookieAuth": []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: "Create a category."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Category"
        "400":
          "$ref": "#/components/responses/InvalidRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/AdminWriteForbidden"
        "409":
          "$ref": "#/components/responses/MasterNameTaken"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "422":
          "$ref": "#/components/responses/InvalidMasterData"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/ServiceUnavailable"
  /api/v1/admin/categories/{id}:
    patch:
      operationId: "updateAdminCategory"
      tags:
        - "Admin Categories"
      summary: "Update a category"
      description: "Requires an active exclusive administrator and same-origin write proof. Applies only supplied fields. Set isActive to false to disable the record."
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
        - {"$ref": "#/components/parameters/MasterId"}
        - {"$ref": "#/components/parameters/Origin"}
        - {"$ref": "#/components/parameters/Referer"}
        - {"$ref": "#/components/parameters/SecFetchSite"}
      security:
        - {"cookieAuth": []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: "Update a category."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Category"
        "400":
          "$ref": "#/components/responses/InvalidRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/AdminWriteForbidden"
        "404":
          "$ref": "#/components/responses/MasterNotFound"
        "409":
          "$ref": "#/components/responses/MasterNameTaken"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "422":
          "$ref": "#/components/responses/InvalidMasterData"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/ServiceUnavailable"
  /api/v1/admin/departments:
    get:
      operationId: "listAdminDepartments"
      tags:
        - "Admin Departments"
      summary: "List departments"
      description: "Requires an active exclusive administrator. Lists active and disabled rows sorted by lowercase name and ID. Search matches name or responsibility scope. Includes currently active assigned staff usernames."
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
        - {"$ref": "#/components/parameters/Page"}
        - {"$ref": "#/components/parameters/PageSize"}
        - {"$ref": "#/components/parameters/MasterSearch"}
        - {"$ref": "#/components/parameters/MasterActive"}
      security:
        - {"cookieAuth": []}
      responses:
        "200":
          description: "List departments."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaginatedDepartments"
        "400":
          "$ref": "#/components/responses/InvalidRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/ServiceUnavailable"
    post:
      operationId: "createAdminDepartment"
      tags:
        - "Admin Departments"
      summary: "Create a department"
      description: "Requires an active exclusive administrator and same-origin write proof. New records are active."
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
        - {"$ref": "#/components/parameters/Origin"}
        - {"$ref": "#/components/parameters/Referer"}
        - {"$ref": "#/components/parameters/SecFetchSite"}
      security:
        - {"cookieAuth": []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: "Create a department."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DepartmentSummary"
        "400":
          "$ref": "#/components/responses/InvalidRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/AdminWriteForbidden"
        "409":
          "$ref": "#/components/responses/MasterNameTaken"
        "413":
          "$ref": "#/components/responses/BodyTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "422":
          "$ref": "#/components/responses/InvalidMasterData"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/ServiceUnavailable"
  /api/v1/admin/departments/{id}:
