name: CI

on:
  push:
    branches-ignore:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      ai: ${{ steps.filter.outputs.ai }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: develop
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            ai:
              - 'apps/ai/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'compose.yaml'
              - 'compose.dev.yaml'
              - 'apps/*/Dockerfile'
              - '.github/workflows/ci.yml'

  web-ci:
    name: Web (Next.js / Prettier / ESLint / Test)
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: bun run format:check

      - name: Lint (ESLint)
        run: bun run lint

      - name: Typecheck (TypeScript)
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Cache Next.js build
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/bun.lock') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Build (Next.js — PR / manual only)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          API_BASE_URL: http://127.0.0.1:8080
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

  api-ci:
    name: API (Go / gofmt / golangci-lint / Test)
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Go modules
        run: go mod verify

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: apps/api

      - name: Unit tests (race detector)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  ai-ci:
    name: AI (Python / Ruff / Pytest)
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "apps/ai/uv.lock"

      - name: Install Python from .python-version
        run: uv python install

      - name: Check lockfile
        run: uv lock --check

      - name: Sync environment
        run: uv sync --locked

      - name: Check formatting (Ruff)
        run: uv run --locked ruff format --check .

      - name: Lint (Ruff)
        run: uv run --locked ruff check .

      - name: Unit & contract tests (Pytest)
        run: uv run --locked pytest

      - name: Verify app factory import
        run: uv run --locked python -c 'from ku_spot_ai.main import app_factory; app_factory()'

  compose-ci:
    name: Compose Config Syntax
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet

  ci-gate:
    name: CI Gate
    needs:
      - detect-changes
      - web-ci
      - api-ci
      - ai-ci
      - compose-ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all triggered service checks passed
        env:
          RESULTS: >-
            detect-changes=${{ needs.detect-changes.result }}
            web-ci=${{ needs.web-ci.result }}
            api-ci=${{ needs.api-ci.result }}
            ai-ci=${{ needs.ai-ci.result }}
            compose-ci=${{ needs.compose-ci.result }}
        run: |
          echo "Job results: $RESULTS"
          failed=0
          for entry in $RESULTS; do
            name="${entry%%=*}"
            status="${entry#*=}"
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]; then
              echo "::error::Job '$name' finished with status '$status'"
              failed=1
            fi
          done
          exit "$failed"
