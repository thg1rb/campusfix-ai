name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - name: Detect Web changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"

      - name: Set up Bun
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun dependencies
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        run: bun install --frozen-lockfile

      - name: Check formatting (Prettier)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        run: bun run format:check

      - name: Lint (ESLint)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        run: bun run lint

      - name: Typecheck (TypeScript)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        run: bun run typecheck

      - name: Unit tests (Vitest)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        run: bun run test

      - name: Cache Next.js build
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/bun.lock') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Build (Next.js)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true'
        env:
          API_BASE_URL: http://127.0.0.1:8080
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: kuspot
          POSTGRES_PASSWORD: kuspot-ci
          POSTGRES_DB: kuspot_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U kuspot -d kuspot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - name: Detect API & Compose changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'compose.yaml'
              - 'compose.dev.yaml'
              - 'apps/*/Dockerfile'
              - '.github/workflows/ci.yml'

      - name: Validate Compose configurations
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.compose == 'true'
        working-directory: .
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet

      - name: Set up Go
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check formatting (gofmt)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Go modules
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        run: go mod verify

      - name: Static analysis (go vet)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        run: go vet ./...

      - name: Lint (golangci-lint)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: apps/api

      - name: Unit and PostgreSQL integration tests (race detector)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        env:
          KU_SPOT_TEST_DATABASE_URL: postgresql://kuspot:kuspot-ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/kuspot_test?sslmode=disable
        run: go test -race -count=1 ./...

      - name: Build
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        run: go build ./...

  ai:
    name: AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - name: Detect AI changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ai:
              - 'apps/ai/**'
              - '.github/workflows/ci.yml'

      - name: Set up uv
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ai == 'true'
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "apps/ai/uv.lock"

      - name: Install Python from .python-version
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ai == 'true'
        run: uv python install

      - name: Check lockfile
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ai == 'true'
        run: uv lock --check

      - name: Sync environment
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ai == 'true'
        run: uv sync --locked

      - name: Check formatting (Ruff)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ai == 'true'
        run: uv run --locked ruff format --check .

      - name: Lint (Ruff)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ai == 'true'
        run: uv run --locked ruff check .

      - name: Unit & contract tests (Pytest)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ai == 'true'
        run: uv run --locked pytest

      - name: Verify app factory import
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ai == 'true'
        run: uv run --locked python -c 'from ku_spot_ai.main import app_factory; app_factory()'
